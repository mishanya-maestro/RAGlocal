<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ code }} — статья {{ number }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
</head>
<body class="source-body">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-text">Юридический ассистент РБ</span>
    </div>
    <a href="{{ url_for('index') }}" class="back-link">← В чат</a>
  </header>

  <main class="source-page">
    <article class="source-article">
      <header class="source-header">
        <p class="source-code">{{ code }}</p>
        <h1>Статья {{ number }}</h1>
      </header>
      <div class="source-highlight">{{ article_text }}</div>
    </article>
  </main>
</body>
</html>
